<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="32" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Branch and Cut: cuando la relajacion permite subtours</text>
  <text x="32" y="70" font-family="Arial, sans-serif" font-size="14" fill="#46505f">Un corte agrega una restriccion valida: elimina soluciones artificiales de la relajacion sin eliminar tours factibles.</text>
  <g transform="translate(42,105)">
    <text x="0" y="-16" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Antes del corte</text>
    <path d="M70,90 C105,35 175,35 210,90 C175,145 105,145 70,90 Z" fill="none" stroke="#dc2626" stroke-width="5"/>
    <path d="M300,95 C340,35 430,40 465,100 C425,160 340,155 300,95 Z" fill="none" stroke="#dc2626" stroke-width="5"/>
    <g fill="#f8fafc" stroke="#111827" stroke-width="2" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700">
      <circle cx="70" cy="90" r="13"/><text x="70" y="95" fill="#111827" stroke="none">1</text>
      <circle cx="140" cy="42" r="13"/><text x="140" y="47" fill="#111827" stroke="none">2</text>
      <circle cx="210" cy="90" r="13"/><text x="210" y="95" fill="#111827" stroke="none">3</text>
      <circle cx="300" cy="95" r="13"/><text x="300" y="100" fill="#111827" stroke="none">4</text>
      <circle cx="383" cy="43" r="13"/><text x="383" y="48" fill="#111827" stroke="none">5</text>
      <circle cx="465" cy="100" r="13"/><text x="465" y="105" fill="#111827" stroke="none">6</text>
    </g>
    <text x="85" y="170" font-family="Arial, sans-serif" font-size="14" fill="#374151">dos ciclos separados</text>
    <text x="294" y="170" font-family="Arial, sans-serif" font-size="14" fill="#374151">parece barato, pero no es un tour</text>
  </g>
  <g transform="translate(42,282)">
    <text x="0" y="-16" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Despues del corte</text>
    <path d="M70,70 L140,25 L210,70 L300,75 L383,25 L465,80 L70,70" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="230" y1="20" x2="245" y2="120" stroke="#111827" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="256" y="40" font-family="Arial, sans-serif" font-size="13" fill="#111827">corte: debe existir conexion entre grupos</text>
    <g fill="#f8fafc" stroke="#111827" stroke-width="2" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700">
      <circle cx="70" cy="70" r="13"/><text x="70" y="75" fill="#111827" stroke="none">1</text>
      <circle cx="140" cy="25" r="13"/><text x="140" y="30" fill="#111827" stroke="none">2</text>
      <circle cx="210" cy="70" r="13"/><text x="210" y="75" fill="#111827" stroke="none">3</text>
      <circle cx="300" cy="75" r="13"/><text x="300" y="80" fill="#111827" stroke="none">4</text>
      <circle cx="383" cy="25" r="13"/><text x="383" y="30" fill="#111827" stroke="none">5</text>
      <circle cx="465" cy="80" r="13"/><text x="465" y="85" fill="#111827" stroke="none">6</text>
    </g>
  </g>
</svg>
