<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="32" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Tabu Search: memoria y trayectoria de busqueda</text>
  <text x="32" y="70" font-family="Arial, sans-serif" font-size="14" fill="#46505f">La lista tabu no mejora por si sola: evita volver demasiado rapido y fuerza a mirar otras zonas.</text>
  <g transform="translate(78,105)">
    <line x1="0" y1="250" x2="590" y2="250" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="250" stroke="#111827" stroke-width="2"/>
    <text x="250" y="290" font-family="Arial, sans-serif" font-size="14" fill="#374151">iteraciones</text>
    <text x="-56" y="28" font-family="Arial, sans-serif" font-size="14" fill="#374151">costo</text>
    <polyline points="0,70 55,92 110,130 165,158 220,176 275,181 330,184 385,186 440,188 495,189 560,189"
      fill="none" stroke="#9ca3af" stroke-width="4"/>
    <polyline points="0,70 55,100 110,146 165,140 220,168 275,161 330,185 385,170 440,197 495,188 560,205"
      fill="none" stroke="#2563eb" stroke-width="4"/>
    <polyline points="0,70 55,112 110,118 165,165 220,145 275,190 330,166 385,208 440,176 495,215 560,198"
      fill="none" stroke="#dc2626" stroke-width="4"/>
    <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
      <rect x="395" y="25" width="182" height="76" rx="6" fill="#f8fafc" stroke="#d1d5db"/>
      <line x1="410" y1="45" x2="445" y2="45" stroke="#9ca3af" stroke-width="4"/><text x="454" y="50">hill-climbing</text>
      <line x1="410" y1="68" x2="445" y2="68" stroke="#2563eb" stroke-width="4"/><text x="454" y="73">tabu equilibrado</text>
      <line x1="410" y1="91" x2="445" y2="91" stroke="#dc2626" stroke-width="4"/><text x="454" y="96">tabu muy largo</text>
    </g>
  </g>
  <text x="96" y="388" font-family="Arial, sans-serif" font-size="14" fill="#374151">Hill-climbing se estanca cuando no acepta empeorar. Tabu puede empeorar para salir, pero necesita un tenure razonable.</text>
</svg>
