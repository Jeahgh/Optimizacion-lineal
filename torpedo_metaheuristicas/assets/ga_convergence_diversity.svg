<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="32" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Algoritmo genetico: mejora y diversidad</text>
  <text x="32" y="70" font-family="Arial, sans-serif" font-size="14" fill="#46505f">La poblacion debe mejorar sin volverse toda igual demasiado pronto.</text>
  <g transform="translate(70,110)">
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Mejor fitness</text>
    <line x1="0" y1="190" x2="270" y2="190" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="190" stroke="#111827" stroke-width="2"/>
    <polyline points="0,170 35,150 70,128 105,118 140,88 175,82 210,58 245,52 270,45"
      fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="225" font-family="Arial, sans-serif" font-size="13" fill="#374151">seleccion + crossover empujan hacia mejores individuos</text>
  </g>
  <g transform="translate(430,110)">
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Diversidad</text>
    <line x1="0" y1="190" x2="270" y2="190" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="190" stroke="#111827" stroke-width="2"/>
    <polyline points="0,45 35,62 70,80 105,92 140,120 175,132 210,146 245,158 270,165"
      fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="120" y1="115" x2="175" y2="90" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <text x="184" y="93" font-family="Arial, sans-serif" font-size="13" fill="#166534">mutacion</text>
    <text x="44" y="225" font-family="Arial, sans-serif" font-size="13" fill="#374151">sin diversidad aparece convergencia prematura</text>
  </g>
  <text x="80" y="383" font-family="Arial, sans-serif" font-size="14" fill="#374151">El objetivo no es solo que suba el fitness: tambien importa conservar caminos nuevos para explorar.</text>
</svg>
